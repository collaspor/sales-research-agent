[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-research-agent"
version = "0.1.0"
description = "Evidence-driven public web research agent for presales engineers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "trafilatura>=2.2,<3",
    "typer>=0.16,<1",
]

[project.scripts]
sales-research = "sales_research_agent.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sales_research_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not live"'
markers = ["live: tests that require external network access or API keys"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sales_research_agent"]
